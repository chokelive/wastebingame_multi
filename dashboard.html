<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WasteBin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-hero">
      <div>
        <h1>WasteBin Dashboard</h1>
        <p>Central TV scoreboard for mobile players</p>
      </div>
      <button id="dashboard-qr-open" class="dashboard-qr" type="button" aria-label="Open large QR code">
        <img src="qr.png" alt="QR code for mobile players">
        <span>Scan to play</span>
      </button>
    </header>

    <section class="dashboard-panel standalone-dashboard" aria-labelledby="dashboard-title">
      <div class="dashboard-heading">
        <div>
          <h2 id="dashboard-title">Scoreboard</h2>
          <p>Latest submitted player appears at the top.</p>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Last Score</th>
            <th>Best Score</th>
            <th>Correct</th>
            <th>Wrong</th>
            <th>Rounds</th>
          </tr>
        </thead>
        <tbody id="leaderboard-list"></tbody>
      </table>
    </section>
  </main>

  <div id="dashboard-qr-modal" class="qr-modal" hidden>
    <div class="qr-modal-card dashboard-qr-modal-card" role="dialog" aria-modal="true" aria-label="Large QR code for mobile players">
      <button id="dashboard-qr-close" class="qr-close" type="button" aria-label="Close">x</button>
      <img src="qr.png" alt="QR code for mobile players">
      <span>Scan to play</span>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
