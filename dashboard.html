<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WasteBin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-hero">
      <div>
        <h1>WasteBin Dashboard</h1>
        <p>Central TV scoreboard for mobile players</p>
      </div>
      <a class="dashboard-qr" href="index.html" aria-label="Open player page">
        <img src="qr.png" alt="QR code for mobile players">
        <span>Scan to play</span>
      </a>
    </header>

    <section class="dashboard-control-panel" aria-label="Game controls">
      <div class="control-status">
        <span id="game-status">Waiting</span>
        <small>Game status</small>
      </div>
      <label>
        Items
        <select id="dashboard-round-size">
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="16">16</option>
          <option value="24">24</option>
        </select>
      </label>
      <button id="dashboard-clear" class="secondary-button" type="button">Clear Scores</button>
      <button id="dashboard-start" type="button">Start Game</button>
      <button id="dashboard-stop" class="secondary-button" type="button">Stop Game</button>
    </section>

    <section class="dashboard-panel standalone-dashboard" aria-labelledby="dashboard-title">
      <div class="dashboard-heading">
        <div>
          <h2 id="dashboard-title">Scoreboard</h2>
          <p>Scores update automatically when each player finishes a round.</p>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Last Score</th>
            <th>Best Score</th>
            <th>Correct</th>
            <th>Wrong</th>
            <th>Rounds</th>
          </tr>
        </thead>
        <tbody id="leaderboard-list"></tbody>
      </table>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
